name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build # tsc --noEmit + vite build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Import smoke: catches broken intra-package imports and missing deps
      - run: python -c "import main; assert {'/lbo', '/ma', '/health'} <= {r.path for r in main.app.routes}"
      # The LLM SDKs are lazily imported at runtime — verify they install.
      # (Their absence from requirements.txt once silently broke every LLM
      # call in the deployed AIO LBO container.)
      - run: python -c "import anthropic, openai; from google import genai"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t deal-suite-api ./backend
